<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ollama speaks</title>
<style>
:root{
  --bg:#05060a; --glass:rgba(14,17,26,.62); --glass2:rgba(22,26,38,.75); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#eef0f6; --dim:#8a93a8; --dim2:#5d667a;
  --amber:#ffb347; --cyan:#4fd8ff; --violet:#b48cff; --idle:#6f7fa8; --danger:#ff6b6b;
  --accent:var(--amber);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--glass2);border-radius:12px;padding:7px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .15s,background .15s,transform .08s}
button:hover{border-color:var(--line2)}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#1a1000;border-color:transparent;font-weight:650}
button:disabled{opacity:.4;cursor:default}
select{background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:190px}
select option{background:#13161f}
::selection{background:var(--accent);color:#000}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.55) 100%)}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:12px 14px;z-index:5}
.hud .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--dim)}
.hud .brand .dot{width:8px;height:8px;border-radius:50%;background:#444;box-shadow:0 0 12px transparent;transition:all .4s}
.hud .brand .dot.ok{background:#4cd47a;box-shadow:0 0 12px #4cd47a}
.hud .title{flex:1;min-width:80px;background:none;border:none;font-size:15px;font-weight:500;padding:6px 10px;border-radius:10px;color:var(--text);outline:none;text-align:center}
.hud .title::placeholder{color:var(--dim2)}
.hud .title:focus{background:var(--glass)}
.hud .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--glass2);backdrop-filter:blur(14px)}
.seg button{border:none;border-radius:0;background:transparent;padding:6px 14px;color:var(--dim);backdrop-filter:none}
.seg button.on{background:var(--accent);color:#1a1000;font-weight:650}
.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;cursor:pointer;user-select:none;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--glass2)}
.toggle input{accent-color:var(--accent);margin:0}
.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:16px}

/* stage captions */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none;z-index:3;padding-bottom:230px}
.cap{max-width:min(820px,88vw);text-align:center;text-wrap:balance}
.cap.user{font-size:15px;color:var(--dim);margin-bottom:14px;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.cap.user.show{opacity:1;transform:none}
.cap.ai{font-size:clamp(20px,2.6vw,30px);font-weight:500;line-height:1.3;letter-spacing:-.01em;min-height:1.3em;text-shadow:0 2px 30px rgba(0,0,0,.8);opacity:0;transition:opacity .5s}
.cap.ai.show{opacity:1}
.cap .who{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);margin-top:12px;font-weight:600}
.state{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.45);pointer-events:none;z-index:3;transition:opacity .3s}
.state.hide{opacity:0}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.voicebar{width:min(980px,100%);display:flex;align-items:center;gap:8px}
.voicebar .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);font-weight:600;white-space:nowrap}
.strip{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.strip::-webkit-scrollbar{display:none}
.strip.wrap{flex-wrap:wrap;max-height:34vh;overflow-y:auto;mask-image:none;padding:10px;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px)}
.chip{border-radius:999px;padding:5px 13px;font-size:13px;white-space:nowrap;color:var(--dim)}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);color:#1a1000;border-color:transparent;font-weight:650;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.char{border-style:dashed}
.voicebar input{background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;width:130px;outline:none;backdrop-filter:blur(14px)}
.composer{width:min(980px,100%);display:flex;gap:10px;align-items:flex-end;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:10px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
textarea{flex:1;resize:none;min-height:44px;max-height:180px;background:transparent;border:none;padding:11px 10px;outline:none;font-size:16px}
textarea::placeholder{color:var(--dim2)}
.mic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:19px;position:relative;flex:none}
.mic.rec{background:var(--cyan);border-color:transparent;color:#001;animation:pulse 1.1s infinite}
.mic.busy{background:var(--violet);border-color:transparent;color:#001}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,216,255,.6)}100%{box-shadow:0 0 0 16px rgba(79,216,255,0)}}
.send{height:48px;padding:0 20px;border-radius:16px;flex:none}
.hint{width:min(980px,100%);display:flex;justify-content:space-between;font-size:12px;color:var(--dim2);padding:0 10px;min-height:16px}
.sys{width:min(980px,100%);display:none}
.sys.open{display:block}
.sys textarea{width:100%;min-height:64px;font-size:13px;background:var(--glass);border:1px solid var(--line);border-radius:14px}

/* drawers */
.drawer{position:fixed;top:0;bottom:0;width:320px;max-width:90vw;background:rgba(10,12,18,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--line);z-index:8;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.right{left:auto;right:0;border-right:none;border-left:1px solid var(--line);transform:translateX(100%);width:420px}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600}
.drawer header span{flex:1}
.drawer .body{flex:1;overflow:auto;padding:0 10px 14px}
.conv{padding:10px 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--dim)}
.conv:hover{background:rgba(255,255,255,.05)}
.conv.active{background:rgba(255,255,255,.08);color:var(--text)}
.conv .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
.conv .n{font-size:11px;color:var(--dim2)}
.conv .x{opacity:0;border:none;background:none;padding:2px 6px;color:var(--dim);backdrop-filter:none}
.conv:hover .x{opacity:1}.conv .x:hover{color:var(--danger)}
.msg{padding:10px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word;font-size:14px;border:1px solid transparent}
.msg.user{background:rgba(79,216,255,.08);border-color:rgba(79,216,255,.15);margin-left:30px}
.msg.assistant{background:rgba(255,179,71,.08);border-color:rgba(255,179,71,.15);margin-right:30px}
.msg.spoken{background:rgba(180,140,255,.08);border-color:rgba(180,140,255,.15);margin-right:30px}
.msg.playing{border-color:var(--accent)}
.msg .meta{font-size:11px;color:var(--dim2);margin-top:6px;display:flex;gap:10px;align-items:center}
.msg .meta button{border:none;background:none;padding:0;color:var(--dim);font-size:12px;backdrop-filter:none}
.msg .meta button:hover{color:var(--text)}
.foot{padding:10px 14px;font-size:11px;color:var(--dim2);border-top:1px solid var(--line);font-family:var(--mono)}
.scrim{position:fixed;inset:0;z-index:7;display:none}
.scrim.show{display:block}
.empty{color:var(--dim2);font-size:13px;padding:14px 12px;line-height:1.6}
kbd{font-family:var(--mono);background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px;border:1px solid var(--line);font-size:12px}
@media (max-width:760px){.hud .right select{display:none}.stage{padding-bottom:210px}.cap.ai{font-size:20px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div><div class="grain"></div>

<div class="hud">
  <button class="icon" id="convsBtn" title="Conversations">☰</button>
  <div class="brand"><span class="dot" id="dot"></span>ollama speaks</div>
  <input class="title" id="title" placeholder="untitled conversation" spellcheck="false">
  <div class="right">
    <div class="seg" id="modeSeg">
      <button data-mode="speak" title="Type it, pick a voice, hear it">Speak</button>
      <button data-mode="chat" title="Talk back and forth with a local model">Converse</button>
    </div>
    <select id="chatModel" title="Chat model"></select>
    <select id="ttsModel" title="Voice model"></select>
    <label class="toggle" id="hfWrap" title="Listen again automatically after each reply"><input type="checkbox" id="handsfree"> hands-free</label>
    <button class="icon" id="sysBtn" title="System prompt">⚙</button>
    <button class="icon" id="transBtn" title="Transcript">≡</button>
  </div>
</div>

<div class="state" id="state">ready</div>
<div class="stage">
  <div class="cap user" id="capUser"></div>
  <div class="cap ai" id="capAI"><span id="capText"></span><span class="who" id="capWho"></span></div>
</div>

<div class="dock">
  <div class="voicebar">
    <span class="lbl">voice</span>
    <div class="strip" id="chips"></div>
    <input id="voiceFilter" placeholder="filter…">
    <button id="previewBtn" title="Hear the selected voice">▶</button>
    <button id="moreBtn" title="Show all voices">all</button>
  </div>
  <div class="composer">
    <button class="mic" id="mic" title="Click or hold space to talk">🎙</button>
    <textarea id="input" rows="1" placeholder="Type what you want spoken…"></textarea>
    <button class="send primary" id="send">Speak</button>
  </div>
  <div class="hint"><span id="hintL"></span><span id="hintR"></span></div>
  <div class="sys" id="sys"><textarea id="sysPrompt" placeholder="System prompt for Converse mode"></textarea></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="convsDrawer">
  <header><span>conversations</span><button id="newBtn">+ new</button></header>
  <div class="body" id="convs"></div>
  <div class="foot" id="foot">connecting…</div>
</aside>
<aside class="drawer right" id="transDrawer">
  <header><span>transcript</span><button id="exportBtn" title="Export as text">⤓ txt</button></header>
  <div class="body" id="log"></div>
</aside>

<script src="/static/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const el = {};
['dot','foot','convs','newBtn','title','modeSeg','chatModel','ttsModel','handsfree','hfWrap','sysBtn','transBtn','convsBtn','exportBtn',
 'voiceFilter','previewBtn','moreBtn','chips','log','mic','input','send','hintL','hintR','sys','sysPrompt',
 'capUser','capAI','capText','capWho','state','scrim','convsDrawer','transDrawer'].forEach(id=>el[id]=$('#'+id));

const DEFAULT_SYS = "You are a friendly voice assistant talking out loud with Lalo. Keep replies short and conversational, usually one to three sentences, because they will be spoken aloud. No markdown, no lists, no emojis, no stage directions.";
const CHAR_VOICES = /Ogre|Elf|Captain|Fairy|Queen|Thing Under|Ancient|Sir |Master |Old |Morwenna|Azgorath|Vyrmathrax|Snow/;

// ============================================================ state
const S = {
  settings: Object.assign({voice:'Hadley', ttsModel:'phonon:latest', chatModel:'', mode:'speak', sysPrompt:DEFAULT_SYS, handsfree:false},
                          JSON.parse(localStorage.getItem('speech.settings')||'{}')),
  voices:[], conv:null, convs:[], whisper:'checking', busy:false, listening:false, orbState:'idle',
};
const saveSettings = () => localStorage.setItem('speech.settings', JSON.stringify(S.settings));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const api = {
  get: p => fetch(p).then(r => r.json()),
  json: (p, body, method='POST') => fetch(p,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{ if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).error||r.statusText);} return r.json(); }),
};

// ============================================================ audio graph (shared by playback + mic + orb)
let actx=null, outAnalyser=null, outData=null, micAnalyser=null, micData=null;
function ensureCtx(){
  if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); outAnalyser=actx.createAnalyser(); outAnalyser.fftSize=1024; outAnalyser.smoothingTimeConstant=.6; outData=new Uint8Array(outAnalyser.fftSize); outAnalyser.connect(actx.destination); }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function rms(an, data){ if(!an) return 0; an.getByteTimeDomainData(data); let s=0; for(let i=0;i<data.length;i++){const v=(data[i]-128)/128; s+=v*v;} return Math.sqrt(s/data.length); }

// ============================================================ orb (three.js)
const ORB = (() => {
  const canvas=$('#gl');
  const renderer=new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42, 1, .1, 100); camera.position.set(0,0,6.6);
  const COL={idle:[0x3a4a7a,0x6f7fa8], speaking:[0xff7a1a,0xffd07a], listening:[0x1b6fd8,0x7ff0ff], thinking:[0x6a2bd8,0xd0a0ff]};
  const uniforms={uTime:{value:0}, uLevel:{value:0}, uAgit:{value:0}, uColA:{value:new THREE.Color(COL.idle[0])}, uColB:{value:new THREE.Color(COL.idle[1])}, uOpacity:{value:1}};
  const NOISE=`
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;} vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);} vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}`;
  const vert=NOISE+`
    uniform float uTime,uLevel,uAgit; varying float vD; varying vec3 vN,vP;
    void main(){
      float t=uTime*(0.25+uAgit*0.9);
      float n=snoise(position*(1.4+uAgit*1.2)+vec3(t,t*0.7,-t*0.5));
      float n2=snoise(position*(4.0+uLevel*6.0)+vec3(-t*1.7,t*1.3,t))*0.35;
      float d=(n+n2)*(0.06+uLevel*0.55+uAgit*0.08);
      vD=d; vN=normalMatrix*normal; vec3 p=position+normal*d; vP=(modelViewMatrix*vec4(p,1.0)).xyz;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`;
  const frag=`
    uniform vec3 uColA,uColB; uniform float uLevel,uOpacity; varying float vD; varying vec3 vN,vP;
    void main(){
      vec3 n=normalize(vN); vec3 v=normalize(-vP);
      float fres=pow(1.0-max(dot(n,v),0.0),2.2);
      float k=smoothstep(-0.25,0.35,vD*2.5+uLevel*0.6);
      vec3 base=mix(uColA,uColB,k);
      vec3 col=base*(0.35+0.65*k)+uColB*fres*(0.9+uLevel*1.5)+vec3(1.0)*pow(fres,5.0)*0.5;
      gl_FragColor=vec4(col,uOpacity);}`;
  const detail = Math.min(window.innerWidth,window.innerHeight)<600 ? 24 : 48;
  const geo=new THREE.IcosahedronGeometry(1, detail);
  const mat=new THREE.ShaderMaterial({uniforms, vertexShader:vert, fragmentShader:frag, transparent:true});
  const orb=new THREE.Mesh(geo, mat); scene.add(orb);
  // particle shell
  const shellGeo=new THREE.IcosahedronGeometry(1.55, 20);
  const shellMat=new THREE.PointsMaterial({color:0xffffff, size:0.012, transparent:true, opacity:.22, blending:THREE.AdditiveBlending, depthWrite:false});
  const shell=new THREE.Points(shellGeo, shellMat); scene.add(shell);
  // glow sprite
  const gc=document.createElement('canvas'); gc.width=gc.height=256; const g=gc.getContext('2d');
  const grd=g.createRadialGradient(128,128,10,128,128,128); grd.addColorStop(0,'rgba(255,255,255,.55)'); grd.addColorStop(.35,'rgba(255,255,255,.12)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,256,256);
  const glowMat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(gc), color:new THREE.Color(COL.idle[1]), transparent:true, opacity:.6, blending:THREE.AdditiveBlending, depthWrite:false});
  const glow=new THREE.Sprite(glowMat); glow.scale.set(4.2,4.2,1); glow.position.z=-0.5; scene.add(glow);

  let level=0, agit=0, targetA=new THREE.Color(COL.idle[0]), targetB=new THREE.Color(COL.idle[1]), t0=performance.now();
  function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); const s=Math.min(1, w/900); orb.position.y=0.25*(1-s)+0.42; shell.position.y=glow.position.y=orb.position.y; }
  addEventListener('resize',resize); resize();
  function setState(st){
    const c=COL[st]||COL.idle; targetA.set(c[0]); targetB.set(c[1]);
    S.orbState=st;
  }
  function frame(){
    requestAnimationFrame(frame);
    const t=(performance.now()-t0)/1000;
    // audio level: whichever source is live
    let src=0;
    if(S.orbState==='speaking') src=rms(outAnalyser,outData)*2.6;
    else if(S.orbState==='listening') src=rms(micAnalyser,micData)*3.2;
    else if(S.orbState==='thinking') src=0.08+Math.sin(t*9)*0.04;
    else src=0.02+Math.sin(t*1.3)*0.015;
    level += (Math.min(1,src)-level)*(src>level?.35:.08);
    const targetAgit = S.orbState==='thinking'?1:(S.orbState==='listening'?.35:0);
    agit += (targetAgit-agit)*.06;
    uniforms.uTime.value=t; uniforms.uLevel.value=level; uniforms.uAgit.value=agit;
    uniforms.uColA.value.lerp(targetA,.05); uniforms.uColB.value.lerp(targetB,.05);
    glowMat.color.lerp(targetB,.05); glowMat.opacity=.45+level*.9; const gs=4.0+level*2.2; glow.scale.set(gs,gs,1);
    orb.rotation.y=t*.12; orb.rotation.x=Math.sin(t*.2)*.15;
    shell.rotation.y=-t*.05; shell.rotation.z=t*.03; const ss=1+level*.25; shell.scale.set(ss,ss,ss); shellMat.opacity=.12+level*.5+agit*.15; shellMat.size=0.012+level*0.02;
    renderer.render(scene,camera);
  }
  frame();
  return {setState};
})();
function setOrb(st, label){ ORB.setState(st); el.state.textContent=label||st; el.state.classList.toggle('hide', !!(S.conv&&S.conv.messages.length) && st!=='idle'); }

// ============================================================ audio queue
const audio = {
  q:[], playing:false, current:null,
  stop(){ this.q.length=0; if(this.current){ this.current.pause(); this.current.src=''; this.current=null; } this.playing=false; document.querySelectorAll('.msg.playing').forEach(m=>m.classList.remove('playing')); if(S.orbState==='speaking') setOrb(S.busy?'thinking':'idle'); },
  push(p, msgEl){ this.q.push({p, msgEl}); if(!this.playing) this.next(); },
  async next(){
    const item=this.q.shift();
    if(!item){ this.playing=false; if(S.orbState==='speaking') setOrb('idle','ready'); onQueueDrained(); return; }
    this.playing=true;
    let url; try{ url=await item.p; }catch(e){ setHint(''+e.message); return this.next(); }
    if(!url) return this.next();
    await new Promise(res=>{
      ensureCtx();
      const a=new Audio(url); a.crossOrigin='anonymous'; this.current=a;
      try{ const node=actx.createMediaElementSource(a); node.connect(outAnalyser); }catch(e){}
      item.msgEl && item.msgEl.classList.add('playing'); setOrb('speaking', S.settings.voice);
      a.onended=a.onerror=()=>{ item.msgEl && item.msgEl.classList.remove('playing'); this.current=null; res(); };
      a.play().catch(()=>res());
    });
    this.next();
  }
};
async function tts(text){
  const r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:S.settings.ttsModel, voice:S.settings.voice, input:text})});
  if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).error||'tts failed'); }
  return URL.createObjectURL(await r.blob());
}

// ============================================================ captions
function caption(user, ai, who){
  if(user!==undefined){ el.capUser.textContent=user||''; el.capUser.classList.toggle('show', !!user); }
  if(ai!==undefined){ el.capText.textContent=ai||''; el.capWho.textContent=who||''; el.capAI.classList.toggle('show', !!ai); }
}

// ============================================================ conversations
function newConv(){
  S.conv={id:uid(), title:'', created:Date.now()/1000, updated:0, voice:S.settings.voice, ttsModel:S.settings.ttsModel, chatModel:S.settings.chatModel, mode:S.settings.mode, sysPrompt:S.settings.sysPrompt, messages:[]};
  el.title.value=''; caption('', ''); renderLog(); renderConvs(); setOrb('idle','ready');
}
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveConv,400); }
async function saveConv(){
  const c=S.conv; if(!c||!c.messages.length) return;
  c.voice=S.settings.voice; c.ttsModel=S.settings.ttsModel; c.chatModel=S.settings.chatModel; c.mode=S.settings.mode; c.sysPrompt=S.settings.sysPrompt;
  if(!c.title){ const first=c.messages.find(m=>m.role!=='assistant'); c.title=(first?first.text:'Conversation').slice(0,48); el.title.value=c.title; }
  const clean=Object.assign({}, c, {messages:c.messages.map(m=>({role:m.role,text:m.text,voice:m.voice,ts:m.ts,viaMic:m.viaMic}))});
  const r=await api.json('/api/conversations/'+c.id, clean, 'PUT'); c.updated=r.updated; loadConvList();
}
async function loadConvList(){ S.convs=await api.get('/api/conversations'); renderConvs(); }
async function openConv(id){
  audio.stop(); stopListening();
  const c=await api.get('/api/conversations/'+id);
  S.conv=c; el.title.value=c.title||'';
  for(const k of ['voice','ttsModel','chatModel','mode','sysPrompt']) if(c[k]) S.settings[k]=c[k];
  saveSettings(); applySettingsToUI(); await loadVoices(); renderLog(); renderConvs();
  const lastAI=[...c.messages].reverse().find(m=>m.role!=='user'); const lastU=[...c.messages].reverse().find(m=>m.role==='user');
  caption(lastU?lastU.text:'', lastAI?lastAI.text:'', lastAI?(lastAI.voice||''):'');
  setOrb('idle','ready'); closeDrawers();
}
async function deleteConv(id){ await fetch('/api/conversations/'+id,{method:'DELETE'}); if(S.conv&&S.conv.id===id) newConv(); loadConvList(); }
function renderConvs(){
  el.convs.innerHTML='';
  if(!S.convs.length){ el.convs.innerHTML='<div class="empty">Nothing saved yet. Conversations save themselves as you go.</div>'; return; }
  for(const c of S.convs){
    const d=document.createElement('div'); d.className='conv'+(S.conv&&S.conv.id===c.id?' active':'');
    d.innerHTML=`<span class="t">${esc(c.title||'Untitled')}</span><span class="n">${c.count}</span><button class="x" title="Delete">✕</button>`;
    d.onclick=e=>{ if(e.target.classList.contains('x')){ if(confirm('Delete this conversation?')) deleteConv(c.id); } else openConv(c.id); };
    el.convs.appendChild(d);
  }
}

// ============================================================ transcript
function renderLog(){
  el.log.innerHTML='';
  const c=S.conv;
  if(!c||!c.messages.length){ el.log.innerHTML=`<div class="empty"><b>Speak</b>: type anything, pick a voice, press <kbd>Enter</kbd>.<br><b>Converse</b>: talk with a local model, it answers in that voice. Tap 🎙 or hold <kbd>space</kbd>. Turn on <b>hands-free</b> for a continuous back-and-forth.<br><kbd>Esc</kbd> stops everything.</div>`; return; }
  for(const m of c.messages) el.log.appendChild(msgEl(m));
  el.log.scrollTop=el.log.scrollHeight;
}
function msgEl(m){
  const d=document.createElement('div'); d.className='msg '+m.role; m.el=d;
  const t=document.createElement('span'); t.className='txt'; t.textContent=m.text; d.appendChild(t);
  const meta=document.createElement('div'); meta.className='meta';
  const who=m.role==='user'?(m.viaMic?'you · mic':'you'):(m.voice||S.settings.voice);
  meta.innerHTML=`<span>${esc(who)}</span>`;
  if(m.role!=='user'){
    const play=document.createElement('button'); play.textContent='▶ replay'; play.onclick=()=>replay(m); meta.appendChild(play);
    const dl=document.createElement('button'); dl.textContent='⤓ wav'; dl.onclick=()=>download(m); meta.appendChild(dl);
  }
  d.appendChild(meta); return d;
}
function addMsg(role, text, extra={}){
  const m=Object.assign({role,text,ts:Date.now()/1000,voice:role==='user'?undefined:S.settings.voice},extra);
  S.conv.messages.push(m);
  if(S.conv.messages.length===1) el.log.innerHTML='';
  el.log.appendChild(msgEl(m)); el.log.scrollTop=el.log.scrollHeight;
  scheduleSave(); return m;
}
async function withVoice(v, fn){ const saved=S.settings.voice; if(v) S.settings.voice=v; try{ return await fn(); } finally{ S.settings.voice=saved; } }
async function replay(m){ audio.stop(); caption(undefined, m.text, m.voice||''); const p=m.url?Promise.resolve(m.url):withVoice(m.voice, ()=>tts(m.text)).then(u=>(m.url=u)); audio.push(p, m.el); }
async function download(m){
  const url=m.url||(m.url=await withVoice(m.voice, ()=>tts(m.text)));
  const a=document.createElement('a'); a.href=url; a.download=(m.voice||'speech').replace(/\s+/g,'_')+'-'+m.text.slice(0,24).replace(/[^\w]+/g,'_')+'.wav'; a.click();
}

// ============================================================ speak / converse
function splitSentences(buf){
  const out=[]; let last=0; const re=/[.!?…]+["')\]]*\s+/g; let m;
  while((m=re.exec(buf))){ const s=buf.slice(last, re.lastIndex).trim(); if(s) out.push(s); last=re.lastIndex; }
  return [out, buf.slice(last)];
}
async function submit(viaMic=false){
  const text=el.input.value.trim(); if(!text||S.busy) return;
  ensureCtx();
  el.input.value=''; autosize();
  if(!S.conv) newConv();
  audio.stop();
  if(S.settings.mode==='speak'){
    const m=addMsg('spoken', text); caption('', text, S.settings.voice);
    audio.push(tts(text).then(u=>(m.url=u)), m.el); return;
  }
  addMsg('user', text, {viaMic}); caption(text, '', '');
  S.busy=true; setBusy(true); setOrb('thinking', S.settings.chatModel);
  const m=addMsg('assistant','');
  const history=[{role:'system',content:S.settings.sysPrompt||DEFAULT_SYS}]
    .concat(S.conv.messages.filter(x=>x.role!=='spoken'&&x!==m).slice(-30).map(x=>({role:x.role,content:x.text})));
  let buf='', full='';
  const speakPart=s=>{ if(s.trim()) audio.push(tts(s), m.el); };
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:S.settings.chatModel, messages:history, think:false})});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
    const rd=r.body.getReader(); const dec=new TextDecoder(); let carry='';
    while(true){
      const {value,done}=await rd.read(); if(done) break;
      carry+=dec.decode(value,{stream:true}); const lines=carry.split('\n'); carry=lines.pop();
      for(const ln of lines){ if(!ln.trim()) continue; let d; try{d=JSON.parse(ln);}catch{continue;}
        if(d.delta){ full+=d.delta; buf+=d.delta; m.text=full; m.el.querySelector('.txt').textContent=full; caption(undefined, full, S.settings.voice); el.log.scrollTop=el.log.scrollHeight;
          const [sents,rest]=splitSentences(buf); sents.forEach(speakPart); buf=rest; }
      }
    }
    if(buf.trim()) speakPart(buf);
    if(!full.trim()){ m.text='(no reply)'; m.el.querySelector('.txt').textContent=m.text; caption(undefined,m.text,''); }
  }catch(e){ m.text='Error: '+e.message; m.el.querySelector('.txt').textContent=m.text; caption(undefined, m.text, ''); }
  m.text=full||m.text; scheduleSave();
  S.busy=false; setBusy(false);
  if(!audio.playing){ setOrb('idle','ready'); onQueueDrained(); }
}
function onQueueDrained(){
  if(S.settings.mode==='chat'&&S.settings.handsfree&&!S.busy&&!S.listening&&S.conv&&S.conv.messages.length) startListening(true);
}

// ============================================================ microphone
let rec=null, stream=null, raf=null, heardSpeech=false, chunks=[], webRec=null, autoStop=false, micSrc=null;
async function startListening(auto=false){
  if(S.listening||S.busy) return;
  audio.stop(); autoStop=auto; ensureCtx();
  if(S.whisper!=='ready') return startWebSpeech();
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ setHint('Microphone blocked: '+e.message); return; }
  S.listening=true; el.mic.classList.add('rec'); setHint(auto?'listening (hands-free)…':'listening… click 🎙 again to stop'); setOrb('listening','listening');
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  chunks=[]; rec=new MediaRecorder(stream, mime?{mimeType:mime}:{});
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop=async()=>{
    const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'}); cleanupMic();
    if(blob.size<2000){ setOrb('idle','ready'); if(autoStop) setTimeout(onQueueDrained,300); return; }
    el.mic.classList.add('busy'); setHint('transcribing…'); setOrb('thinking','transcribing');
    try{
      const r=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':blob.type},body:blob});
      const d=await r.json(); el.mic.classList.remove('busy');
      const text=(d.text||'').trim();
      if(!text||/^\W*$/.test(text)){ setHint('heard nothing'); setOrb('idle','ready'); if(autoStop) setTimeout(onQueueDrained,400); return; }
      el.input.value=text; setHint(''); submit(true);
    }catch(e){ el.mic.classList.remove('busy'); setHint('transcribe failed: '+e.message); setOrb('idle','ready'); }
  };
  rec.start(250);
  micSrc=actx.createMediaStreamSource(stream); micAnalyser=actx.createAnalyser(); micAnalyser.fftSize=1024; micData=new Uint8Array(1024); micSrc.connect(micAnalyser);
  heardSpeech=false; let lastLoud=performance.now(); const t0=performance.now();
  const tick=()=>{
    const r=rms(micAnalyser,micData); const now=performance.now();
    if(r>0.02){ heardSpeech=true; lastLoud=now; }
    const quiet=now-lastLoud;
    if((heardSpeech&&quiet>1300)||(!heardSpeech&&now-t0>8000&&autoStop)||now-t0>90000) return stopListening();
    raf=requestAnimationFrame(tick);
  };
  tick();
}
function stopListening(){
  if(webRec){ try{webRec.stop();}catch{} }
  if(rec&&rec.state!=='inactive'){ rec.stop(); } else if(S.listening&&!webRec){ cleanupMic(); setOrb('idle','ready'); }
}
function cleanupMic(){
  S.listening=false; el.mic.classList.remove('rec'); cancelAnimationFrame(raf);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if(micSrc){ try{micSrc.disconnect();}catch{} micSrc=null; } micAnalyser=null;
}
function startWebSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ setHint('no speech recognition available (whisper: '+S.whisper+')'); return; }
  webRec=new SR(); webRec.lang='en-US'; webRec.interimResults=true; webRec.continuous=false;
  S.listening=true; el.mic.classList.add('rec'); setHint('listening (browser speech)…'); setOrb('listening','listening');
  let finalText='';
  webRec.onresult=e=>{ let s=''; for(const r of e.results){ s+=r[0].transcript; if(r.isFinal) finalText=s; } el.input.value=s; };
  webRec.onerror=e=>setHint('speech error: '+e.error);
  webRec.onend=()=>{ S.listening=false; el.mic.classList.remove('rec'); webRec=null; const t=(finalText||el.input.value).trim(); if(t){ el.input.value=t; submit(true);} else { setOrb('idle','ready'); if(autoStop) setTimeout(onQueueDrained,400); } };
  webRec.start();
}

// ============================================================ voices
let showAll=false;
async function loadVoices(){
  try{
    const d=await api.get('/api/voices?model='+encodeURIComponent(S.settings.ttsModel)); S.voices=d.voices||[];
    if(!S.voices.includes(S.settings.voice)){ S.settings.voice=S.voices.includes('Hadley')?'Hadley':(S.voices[0]||'default'); saveSettings(); }
  }catch(e){ S.voices=[]; setHint('could not load voices: '+e.message); }
  renderChips();
}
function renderChips(){
  const f=el.voiceFilter.value.trim().toLowerCase();
  el.chips.innerHTML=''; el.chips.classList.toggle('wrap', showAll||!!f);
  const list=S.voices.filter(v=>!f||v.toLowerCase().includes(f));
  for(const v of list){
    const b=document.createElement('button'); b.className='chip'+(v===S.settings.voice?' on':'')+(CHAR_VOICES.test(v)?' char':''); b.textContent=v;
    b.onclick=()=>{ S.settings.voice=v; saveSettings(); renderChips(); scheduleSave(); if(!showAll&&!f) b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); };
    b.ondblclick=preview; el.chips.appendChild(b);
  }
  el.moreBtn.textContent=showAll?'less':'all';
  const on=el.chips.querySelector('.on'); if(on&&!showAll&&!f) on.scrollIntoView({inline:'center',block:'nearest'});
}
function preview(){
  audio.stop(); ensureCtx();
  const lines=["Hi, I'm "+S.settings.voice+". This is what I sound like.","Hello Lalo. "+S.settings.voice+" here, ready when you are."];
  const t=lines[Math.floor(Math.random()*lines.length)]; caption(undefined, t, S.settings.voice); audio.push(tts(t));
}

// ============================================================ UI plumbing
function applySettingsToUI(){
  el.modeSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.mode===S.settings.mode));
  el.handsfree.checked=!!S.settings.handsfree; el.sysPrompt.value=S.settings.sysPrompt||DEFAULT_SYS;
  el.ttsModel.value=S.settings.ttsModel; el.chatModel.value=S.settings.chatModel;
  const chat=S.settings.mode==='chat';
  document.documentElement.style.setProperty('--accent', chat?'var(--cyan)':'var(--amber)');
  el.send.textContent=chat?'Send':'Speak';
  el.input.placeholder=chat?'Say something… or just talk':'Type what you want spoken…';
  el.hintL.textContent=chat?'enter to send · hold space to talk · esc to stop':'enter to speak · shift+enter for a new line';
  el.chatModel.style.display=chat?'':'none'; el.hfWrap.style.display=chat?'':'none'; el.sysBtn.style.display=chat?'':'none';
  el.mic.style.display=chat?'':'none';
}
function setBusy(b){ el.send.disabled=b; }
function setHint(t){ el.hintR.textContent=t||''; }
function autosize(){ el.input.style.height='auto'; el.input.style.height=Math.min(180, el.input.scrollHeight)+'px'; }
function closeDrawers(){ el.convsDrawer.classList.remove('open'); el.transDrawer.classList.remove('open'); el.scrim.classList.remove('show'); }
function toggleDrawer(d){ const open=d.classList.contains('open'); closeDrawers(); if(!open){ d.classList.add('open'); el.scrim.classList.add('show'); } }

el.modeSeg.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.settings.mode=b.dataset.mode; saveSettings(); applySettingsToUI(); scheduleSave(); };
el.handsfree.onchange=()=>{ S.settings.handsfree=el.handsfree.checked; saveSettings(); if(S.settings.handsfree&&!audio.playing) onQueueDrained(); };
el.sysBtn.onclick=()=>el.sys.classList.toggle('open');
el.sysPrompt.onchange=()=>{ S.settings.sysPrompt=el.sysPrompt.value.trim()||DEFAULT_SYS; saveSettings(); scheduleSave(); };
el.ttsModel.onchange=()=>{ S.settings.ttsModel=el.ttsModel.value; saveSettings(); loadVoices(); scheduleSave(); };
el.chatModel.onchange=()=>{ S.settings.chatModel=el.chatModel.value; saveSettings(); scheduleSave(); };
el.voiceFilter.oninput=renderChips;
el.moreBtn.onclick=()=>{ showAll=!showAll; renderChips(); };
el.previewBtn.onclick=preview;
el.newBtn.onclick=()=>{ audio.stop(); stopListening(); newConv(); closeDrawers(); el.input.focus(); };
el.convsBtn.onclick=()=>toggleDrawer(el.convsDrawer);
el.transBtn.onclick=()=>toggleDrawer(el.transDrawer);
el.scrim.onclick=closeDrawers;
el.title.onchange=()=>{ if(S.conv){ S.conv.title=el.title.value.trim(); scheduleSave(); } };
el.send.onclick=()=>submit(false);
el.mic.onclick=()=>{ S.listening?stopListening():startListening(false); };
el.input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submit(false);} });
el.input.addEventListener('input',autosize);
el.exportBtn.onclick=()=>{
  const c=S.conv; if(!c||!c.messages.length) return;
  const txt=c.messages.map(m=>`${m.role==='user'?'Lalo':(m.voice||'voice')}: ${m.text}`).join('\n\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'})); a.download=(c.title||'conversation').replace(/[^\w]+/g,'_')+'.txt'; a.click();
};
let spaceDown=false;
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!spaceDown&&!e.target.matches('textarea,input')){ e.preventDefault(); spaceDown=true; if(S.settings.mode==='chat') startListening(false); }
  if(e.key==='Escape'){ audio.stop(); stopListening(); closeDrawers(); setOrb(S.busy?'thinking':'idle', S.busy?'thinking':'ready'); }
});
document.addEventListener('keyup',e=>{ if(e.code==='Space'&&spaceDown){ spaceDown=false; if(S.listening&&!autoStop&&heardSpeech) stopListening(); } });
document.addEventListener('pointerdown',()=>{ if(actx&&actx.state==='suspended') actx.resume(); },{passive:true});

// ============================================================ boot
async function boot(){
  applySettingsToUI(); newConv();
  try{
    const [models,status]=await Promise.all([api.get('/api/models'), api.get('/api/status')]);
    el.ttsModel.innerHTML=models.tts.map(m=>`<option value="${m}">${m.replace(':latest','')}</option>`).join('');
    el.chatModel.innerHTML=models.chat.map(m=>`<option value="${m}">${m}</option>`).join('');
    if(!models.tts.includes(S.settings.ttsModel)) S.settings.ttsModel=models.tts[0]||'phonon';
    if(!models.chat.includes(S.settings.chatModel)) S.settings.chatModel=models.chat[0]||'';
    saveSettings(); applySettingsToUI();
    el.dot.classList.toggle('ok', !!status.ollama); S.whisper=status.whisper; renderFoot(status);
    if(!['ready','missing','error'].includes(status.whisper)){
      const poll=setInterval(async()=>{ const s=await api.get('/api/status'); S.whisper=s.whisper; renderFoot(s); if(['ready','missing','error'].includes(s.whisper)) clearInterval(poll); },3000);
    }
  }catch(e){ el.foot.textContent='cannot reach server: '+e.message; }
  await loadVoices(); await loadConvList(); el.input.focus();
}
function renderFoot(s){
  const w={checking:'whisper checking…',warming:'whisper loading…',ready:'whisper ready · local',missing:'whisper missing → browser speech',error:'whisper error → browser speech'}[s.whisper]||s.whisper;
  el.foot.textContent=`ollama ${s.ollama||'offline'} · ${w}`; el.foot.title=s.whisper_error||s.whisper_model||'';
  setHint(s.whisper==='ready'||S.settings.mode==='speak'?'':w);
}
boot();
})();
